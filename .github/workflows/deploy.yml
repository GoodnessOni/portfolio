name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from https://goodnessoni.github.io/portfolio.
      # To switch to a custom domain, change only these two values, then add
      # the domain under Settings → Pages and put it in public/CNAME:
      #   NEXT_PUBLIC_BASE_PATH: ""
      #   NEXT_PUBLIC_SITE_URL: https://your.domain
      # After Google Search Console gives you an HTML-tag verification code,
      # add the content value here (not the whole meta tag):
      #   NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: the-content-value
      NEXT_PUBLIC_BASE_PATH: /portfolio
      NEXT_PUBLIC_SITE_URL: https://goodnessoni.github.io/portfolio
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
